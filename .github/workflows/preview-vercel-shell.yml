name: Shell Deploy

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  Preview:
    runs-on:
      - ubuntu
      - self-hosted
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SHELL_PROJECT_ID }}
      NX_SKIP_NX_CACHE: true
      GIT_COMMIT_SHA: ${{ github.sha }}
      HUSKY: 0
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Setup dependencies
        run: pnpm install --frozen-lockfile
      - name: Clean Vercel configuration
        run: rm -rf .vercel
      - name: Debug environment variables
        run: |
          echo "VERCEL_ORG_ID: $VERCEL_ORG_ID"
          echo "VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID"
          echo "VERCEL_TOKEN exists: ${{ secrets.VERCEL_TOKEN != '' }}"
      - name: Pull Vercel Environment Information
        run: pnpm exec vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --project-id=$VERCEL_PROJECT_ID
      - name: Build Project Artifacts
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }} --project-id=$VERCEL_PROJECT_ID
      - name: Deploy Project Artifacts to Vercel
        run: pnpm exec vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --project-id=$VERCEL_PROJECT_ID
